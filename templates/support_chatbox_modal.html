<!-- ============================================================ -->
<!-- SUPPORT CHATBOX POPUP MODAL                                  -->
<!-- ============================================================ -->

<div id="supportChatBackdrop" class="support-chat-backdrop" onclick="closeSupportChatbox()"></div>

<div id="supportChatWindow" class="support-chat-window" role="dialog" aria-modal="true" aria-labelledby="supportChatTitle">
    <!-- Header -->
    <div class="support-chat-header">
        <div class="sc-header-left">
            <div class="sc-avatar-wrap">
                <span class="sc-avatar-icon">🎧</span>
                <span class="sc-status-dot" title="Online"></span>
            </div>
            <div>
                <div class="sc-header-title" id="supportChatTitle">Support Assistant</div>
                <div class="sc-header-subtitle">We reply to your queries via email</div>
            </div>
        </div>
        <button type="button" class="sc-close-btn" onclick="closeSupportChatbox()" title="Close Support Chat">✕</button>
    </div>

    <!-- Chat Messages Body -->
    <div class="support-chat-body" id="supportChatBody">
        <!-- Initial Bot Greeting Bubble -->
        <div class="sc-msg-row sc-msg-bot">
            <div class="sc-msg-avatar">🤖</div>
            <div class="sc-msg-bubble sc-bot-bubble">
                <p style="margin: 0;">👋 Hi <strong id="scUserName">there</strong>! Have a question, query, or facing an issue?</p>
                <p style="margin: 6px 0 0; color: #475569; font-size: 12.5px;">Write down your query below. All your previous queries and updates are saved in this chat.</p>
            </div>
        </div>

        <!-- History Loading Indicator -->
        <div id="scLoadingHistory" class="sc-loading-history" style="display: none;">
            <span class="sc-spinner-sm"></span> Loading previous messages...
        </div>

        <!-- Dynamic Messages Stream (Previous queries and new responses) -->
        <div id="scMessagesStream" class="sc-messages-stream"></div>
    </div>

    <!-- Chat Footer Composer Area -->
    <div class="support-chat-footer" id="supportChatFooter">
        <!-- Email Confirmation Row -->
        <div class="sc-email-bar">
            <span class="sc-email-label">Reply To:</span>
            <input type="email" id="scUserEmail" class="sc-email-input" placeholder="e.g. yourname@company.com" required>
        </div>

        <!-- Error Banner -->
        <div id="scErrorMessage" class="sc-error-banner" style="display: none;"></div>

        <!-- Input Box and Send Button -->
        <div class="sc-composer-box">
            <textarea 
                id="scQueryText" 
                class="sc-textarea" 
                rows="1" 
                placeholder="Write your query or message..." 
                onkeydown="handleSupportKey(event)" 
                oninput="autoResizeSupportInput(this)"
                required
            ></textarea>
            <button type="button" id="scSubmitBtn" class="sc-send-btn" onclick="submitSupportChatbox()" title="Send Query">
                <span id="scBtnSpinner" class="sc-spinner" style="display: none;"></span>
                <svg id="scSendIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
        <div class="sc-composer-hint">Press <strong>Enter</strong> to send, <strong>Shift + Enter</strong> for new line</div>
    </div>
</div>

<style>
/* ===== SUPPORT CHATBOX STYLING ===== */
.support-chat-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.38);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 99998;
    opacity: 0;
    transition: opacity 0.25s ease;
}
.support-chat-backdrop.active {
    display: block;
    opacity: 1;
}

.support-chat-window {
    display: none;
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 410px;
    max-width: calc(100vw - 32px);
    height: 580px;
    max-height: calc(100vh - 48px);
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.22), 0 0 0 1px rgba(0, 0, 0, 0.06);
    flex-direction: column;
    z-index: 99999;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transform: translateY(24px) scale(0.96);
    opacity: 0;
    transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}
.support-chat-window.active {
    display: flex;
    transform: translateY(0) scale(1);

}

.support-chat-header {

}

/* Chat Footer Composer */
.support-chat-footer {

.sc-spinner-sm {

@media (max-width: 480px) {
    .support-chat-window {
        bottom: 0;
        right: 0;
        width: 100vw;

        height: 90vh;
        max-height: 90vh;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
    }

</style>

<script>
/* ============================================================ */
/* SUPPORT CHATBOX LOGIC WITH PERSISTENT QUERY HISTORY          */
/* ============================================================ */

// Set to keep track of rendered query IDs to avoid duplicate bubbles
const scRenderedQueryIds = new Set();
let scHistoryLoaded = false;

function escapeHtmlSupport(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function autoResizeSupportInput(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 84) + 'px';
}

function handleSupportKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitSupportChatbox();
    }
}

function scrollToBottomSupport() {
    const body = document.getElementById('supportChatBody');
    if (body) {
        setTimeout(() => {
            body.scrollTop = body.scrollHeight;
        }, 80);
    }
}

function renderUserQueryMessage(q) {
    if (q.id && scRenderedQueryIds.has(q.id)) {
        return;
    }
    if (q.id) {
        scRenderedQueryIds.add(q.id);
    }

    const stream = document.getElementById('scMessagesStream');
    if (!stream) return;

    // Display formatted date and time
    const displayDateTime = q.datetime || (q.date ? `${q.date}, ${q.time}` : 'Just now');
    const displayTime = q.time || 'Delivered';

    // 1. User Message Bubble
    const userRow = document.createElement('div');
    userRow.className = 'sc-msg-row sc-msg-user';
    userRow.innerHTML = `
        <div class="sc-msg-bubble sc-user-bubble">
            <div class="sc-bubble-text">${escapeHtmlSupport(q.query)}</div>
            <div class="sc-bubble-meta">
                <span class="sc-bubble-time">📅 ${escapeHtmlSupport(displayDateTime)}</span>
                <span class="sc-bubble-check" title="Sent to support">✓✓</span>
            </div>
        </div>
    `;
    stream.appendChild(userRow);

    // 2. Bot Confirmation Bubble
    const botRow = document.createElement('div');
    botRow.className = 'sc-msg-row sc-msg-bot';
    const emailToReach = q.email || 'your email';
    botRow.innerHTML = `
        <div class="sc-msg-avatar">🤖</div>
        <div class="sc-msg-bubble sc-bot-bubble">
            <div class="sc-bubble-text">
                We received this query. Our support team is reviewing it and will reach out to <strong>${escapeHtmlSupport(emailToReach)}</strong>.
            </div>
            <div class="sc-bubble-meta">
                <span class="sc-bubble-time">${escapeHtmlSupport(displayTime)}</span>
            </div>
        </div>
    `;
    stream.appendChild(botRow);
}

async function loadSupportHistory() {
    const loadingEl = document.getElementById('scLoadingHistory');
    if (loadingEl && !scHistoryLoaded) loadingEl.style.display = 'flex';

    const token = localStorage.getItem('access_token');
    const username = localStorage.getItem('username') || '';
    const emailInput = document.getElementById('scUserEmail');
    const email = emailInput ? emailInput.value.trim() : '';

    const headers = {};
    if (token) {
        headers['Authorization'] = 'Bearer ' + token;
    }

    const params = new URLSearchParams();
    if (email) params.append('email', email);
    if (username) params.append('username', username);

    try {
        const res = await fetch(`/accounts/support-api/?${params.toString()}`, {
            method: 'GET',
            headers: headers
        });

        if (res.ok) {
            const data = await res.json();
            if (data && Array.isArray(data.queries)) {
                data.queries.forEach(q => renderUserQueryMessage(q));
                scHistoryLoaded = true;
                scrollToBottomSupport();
            }
        }
    } catch (err) {
        console.warn('Could not load previous support history:', err);
    } finally {
        if (loadingEl) loadingEl.style.display = 'none';
    }
}

function openSupportChatbox(e) {
    if (e) {
        e.preventDefault();
        e.stopPropagation();
    }

    // Close any open profile dropdown
    const pd = document.getElementById('profileDropdown');
    if (pd) pd.classList.remove('open');

    const win = document.getElementById('supportChatWindow');
    const backdrop = document.getElementById('supportChatBackdrop');
    if (!win) return;

    win.classList.add('active');
    if (backdrop) backdrop.classList.add('active');

    // Pre-populate user name & email
    const username = localStorage.getItem('username') || 'there';
    const nameEl = document.getElementById('scUserName');
    if (nameEl) nameEl.textContent = username;

    const emailInput = document.getElementById('scUserEmail');
    const token = localStorage.getItem('access_token');

    if (emailInput && !emailInput.value && token) {
        // Fetch current user email from /accounts/me/
        fetch('/accounts/me/', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(res => res.ok ? res.json() : null)
        .then(data => {
            if (data && data.email) {
                emailInput.value = data.email;
            }
            // Load history after email is resolved
            loadSupportHistory();
        })
        .catch(() => {
            loadSupportHistory();
        });
    } else {
        loadSupportHistory();
    }

    // Focus textarea after opening
    setTimeout(() => {
        const txt = document.getElementById('scQueryText');
        if (txt) txt.focus();
        scrollToBottomSupport();
    }, 200);
}

function closeSupportChatbox() {
    const win = document.getElementById('supportChatWindow');
    const backdrop = document.getElementById('supportChatBackdrop');
    if (win) win.classList.remove('active');
    if (backdrop) backdrop.classList.remove('active');
}

function showSupportError(msg) {
    const errEl = document.getElementById('scErrorMessage');
    if (errEl) {
        errEl.textContent = msg;
        errEl.style.display = 'block';
    }
}

function hideSupportError() {
    const errEl = document.getElementById('scErrorMessage');
    if (errEl) errEl.style.display = 'none';
}

async function submitSupportChatbox() {
    hideSupportError();

    const queryInput = document.getElementById('scQueryText');
    const emailInput = document.getElementById('scUserEmail');
    const submitBtn = document.getElementById('scSubmitBtn');
    const spinner = document.getElementById('scBtnSpinner');
    const sendIcon = document.getElementById('scSendIcon');

    const query = queryInput ? queryInput.value.trim() : '';
    const email = emailInput ? emailInput.value.trim() : '';

    if (!query) {
        showSupportError('Please enter your query or message.');
        if (queryInput) queryInput.focus();
        return;
    }

    if (!email) {
        showSupportError('Please provide your contact email so we can reach you.');
        if (emailInput) emailInput.focus();
        return;
    }

    // Set loading state
    submitBtn.disabled = true;
    if (spinner) spinner.style.display = 'inline-block';
    if (sendIcon) sendIcon.style.display = 'none';

    const formData = new FormData();
    formData.append('query', query);
    formData.append('email', email);
    formData.append('username', localStorage.getItem('username') || '');
    formData.append('role', localStorage.getItem('role') || '');

    const token = localStorage.getItem('access_token');
    const headers = {};
    if (token) {
        headers['Authorization'] = 'Bearer ' + token;
    }

    // Read csrftoken cookie if available
    const csrfMatch = document.cookie.match(/(^|;)\s*csrftoken\s*=\s*([^;]+)/);
    if (csrfMatch) {
        headers['X-CSRFToken'] = csrfMatch[2];
    }

    try {
        const res = await fetch('/accounts/support-api/', {
            method: 'POST',
            headers: headers,
            body: formData
        });

        let data = {};
        try {
            data = await res.json();
        } catch (e) {
            data = { error: 'Server returned status ' + res.status };
        }

        if (!res.ok) {
            throw new Error(data.error || data.detail || 'Failed to submit support query (' + res.status + ').');
        }

        // Render the newly submitted query in the chat timeline with date and time!
        if (data && data.query) {
            renderUserQueryMessage(data.query);
        } else {
            // Fallback object if not returned
            const now = new Date();
            renderUserQueryMessage({
                query: query,
                email: email,
                datetime: now.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }),
                time: now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true })
            });
        }

        // Clear query input so user can send another response!
        if (queryInput) {
            queryInput.value = '';
            queryInput.style.height = 'auto';
            queryInput.focus();
        }

        // Auto-scroll chat to latest message
        scrollToBottomSupport();

    } catch (err) {
        showSupportError(err.message || 'An error occurred while sending your query. Please try again.');
    } finally {
        submitBtn.disabled = false;
        if (spinner) spinner.style.display = 'none';
        if (sendIcon) sendIcon.style.display = '';
    }
}
</script>
